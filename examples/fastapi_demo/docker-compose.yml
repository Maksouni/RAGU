services:
  memgraph:
    image: memgraph/memgraph:3.8.1
    container_name: ragu-memgraph
    ports:
      - "127.0.0.1:7687:7687"
    volumes:
      - memgraph_data:/var/lib/memgraph

  memgraph-lab:
    image: memgraph/lab:latest
    container_name: ragu-memgraph-lab
    profiles: ["lab"]
    depends_on:
      - memgraph
    ports:
      - "127.0.0.1:3000:3000"

  fastapi:
    build:
      context: ../..
      dockerfile: examples/fastapi_demo/Dockerfile
    container_name: ragu-fastapi
    depends_on:
      - memgraph
    environment:
      API_KEY: ${API_KEY:-local}
      BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      EMBEDDING_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-qwen2.5:3b}
      EMBEDDER_MODEL_NAME: ${EMBEDDER_MODEL_NAME:-nomic-embed-text}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-20}
      DISABLE_LLM_ANSWERS: ${DISABLE_LLM_ANSWERS:-false}
      MEMGRAPH_URI: bolt://memgraph:7687
      MEMGRAPH_DATABASE: ${MEMGRAPH_DATABASE:-}
      MEMGRAPH_USERNAME: ${MEMGRAPH_USERNAME:-}
      MEMGRAPH_PASSWORD: ${MEMGRAPH_PASSWORD:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ragu_working_dir:/app/ragu_working_dir
    extra_hosts:
      - "host.docker.internal:host-gateway"

  orchestrator:
    build:
      context: ../..
      dockerfile: examples/fastapi_demo/Dockerfile
    container_name: ragu-orchestrator
    depends_on:
      - fastapi
    command: ["python", "-m", "apps.orchestrator.main"]
    environment:
      API_BASE_URL: http://fastapi:8000
      DEFAULT_ASK_MODE: ${DEFAULT_ASK_MODE:-local}
      DEFAULT_ANSWER_MODE: ${DEFAULT_ANSWER_MODE:-auto}
      ASK_TIMEOUT_SEC: ${ASK_TIMEOUT_SEC:-90}
      INGEST_TIMEOUT_SEC: ${INGEST_TIMEOUT_SEC:-90}
      INGEST_INTERVAL_SEC: ${INGEST_INTERVAL_SEC:-15}
      INGEST_BATCH_SIZE: ${INGEST_BATCH_SIZE:-20}
      INGEST_MAX_ATTEMPTS: ${INGEST_MAX_ATTEMPTS:-10}
      INGEST_BACKOFF_BASE_SEC: ${INGEST_BACKOFF_BASE_SEC:-3}
      INGEST_BACKOFF_MAX_SEC: ${INGEST_BACKOFF_MAX_SEC:-120}
      OUTBOX_DB_PATH: /app/ragu_working_dir/integration/outbox.sqlite
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DISABLE_LLM_ANSWERS: ${DISABLE_LLM_ANSWERS:-false}
    volumes:
      - ragu_working_dir:/app/ragu_working_dir
    extra_hosts:
      - "host.docker.internal:host-gateway"

  sheets_sync:
    build:
      context: ../..
      dockerfile: examples/fastapi_demo/Dockerfile
    container_name: ragu-sheets-sync
    profiles: ["sheets"]
    depends_on:
      - orchestrator
    command: ["python", "-m", "apps.sheets_sync.main"]
    environment:
      OUTBOX_DB_PATH: /app/ragu_working_dir/integration/outbox.sqlite
      SHEETS_SYNC_ENABLED: ${SHEETS_SYNC_ENABLED:-false}
      SHEETS_SYNC_INTERVAL_SEC: ${SHEETS_SYNC_INTERVAL_SEC:-15}
      GOOGLE_SHEETS_SPREADSHEET_ID: ${GOOGLE_SHEETS_SPREADSHEET_ID:-}
      GOOGLE_SERVICE_ACCOUNT_JSON_PATH: ${GOOGLE_SERVICE_ACCOUNT_JSON_PATH:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ragu_working_dir:/app/ragu_working_dir

  vk_bot:
    build:
      context: ../..
      dockerfile: examples/fastapi_demo/Dockerfile
    container_name: ragu-vk-bot
    profiles: ["vk"]
    depends_on:
      - orchestrator
    command: ["python", "-m", "apps.vk_bot.main"]
    env_file:
      - path: ../../.env
        required: false
    environment:
      API_BASE_URL: http://fastapi:8000
      VK_BOT_ENABLED: ${VK_BOT_ENABLED:-false}
      VK_API_VERSION: ${VK_API_VERSION:-5.199}
      VK_LONG_POLL_WAIT_SEC: ${VK_LONG_POLL_WAIT_SEC:-25}
      OUTBOX_DB_PATH: /app/ragu_working_dir/integration/outbox.sqlite
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DISABLE_LLM_ANSWERS: ${DISABLE_LLM_ANSWERS:-false}
    volumes:
      - ragu_working_dir:/app/ragu_working_dir
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  memgraph_data:
  ragu_working_dir:
